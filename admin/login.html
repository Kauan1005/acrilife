<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <!-- Impede o "modo escuro automático" do navegador de inverter as cores -->
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#f6f7fb">
    <title>Entrar — Acrilife Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css?v=7">

    <link rel="icon" type="image/png" id="dynamic-favicon" href="">
    <link rel="apple-touch-icon" id="dynamic-apple-icon" href="">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="config.js?v=5"></script>
</head>
<body>
    <div class="bg-decor" aria-hidden="true"></div>

    <main class="login-shell">
        <section class="login-card" aria-label="Entrar no painel">

            <div class="logo-box" id="logoBox" role="img" aria-label="Logo Acrilife">
                <div class="logo-spinner" id="logoSpinner" aria-hidden="true"></div>
            </div>

            <header class="login-header">
                <span class="login-eyebrow"><i class="fas fa-lock" aria-hidden="true"></i> Painel administrativo</span>
                <h1>Bem-vindo de volta</h1>
                <p>Entre com seu e-mail e senha para gerenciar o site.</p>
            </header>

            <form id="loginForm" class="login-form" novalidate autocomplete="on">
                <div class="field-group" id="fieldUsername">
                    <label class="field-label" for="username">E-mail</label>
                    <div class="field-input-wrap">
                        <i class="fas fa-envelope field-icon" aria-hidden="true"></i>
                        <input type="email" id="username" name="username" class="field-input" placeholder="voce@empresa.com.br"
                               autocomplete="email" spellcheck="false" required aria-required="true" aria-describedby="usernameError">
                    </div>
                    <span class="field-error" id="usernameError" role="alert" aria-live="polite"></span>
                </div>

                <div class="field-group" id="fieldPassword">
                    <div class="field-label-row">
                        <label class="field-label" for="password">Senha</label>
                        <button type="button" id="btnEsqueceuSenha" class="link-btn">Esqueceu a senha?</button>
                    </div>
                    <div class="field-input-wrap">
                        <i class="fas fa-lock field-icon" aria-hidden="true"></i>
                        <input type="password" id="password" name="password" class="field-input field-input--password" placeholder="Sua senha"
                               autocomplete="current-password" required aria-required="true" aria-describedby="passwordError">
                        <button type="button" class="field-toggle-pw" id="togglePassword" aria-label="Mostrar senha">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span class="field-error" id="passwordError" role="alert" aria-live="polite"></span>
                </div>

                <div class="login-error-banner" id="loginErrorBanner" role="alert" aria-live="assertive" hidden>
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    <span id="loginErrorText"></span>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-login__label" id="loginBtnLabel">Entrar</span>
                    <span class="btn-login__spinner" id="loginBtnSpinner" aria-hidden="true" hidden><i class="fas fa-spinner fa-spin"></i></span>
                    <i class="fas fa-arrow-right btn-login__arrow" aria-hidden="true"></i>
                </button>
            </form>

            <footer class="form-footer">
                <a href="../index.html" class="form-footer__link" target="_blank" rel="noopener">
                    <i class="fas fa-external-link-alt" aria-hidden="true"></i> Ver site público
                </a>
            </footer>
        </section>

        <p class="login-legal">Acesso restrito. Tentativas de login são registradas.</p>
    </main>

    <script src="login.js?v=6"></script>
</body>
</html>
